т являться общим совместным имуществом супругов (ст. 34 СК РФ), независимо от того, на кого оформлен договор.\nЭто требование направлено на защиту интересов всех сторон и исключение риска оспаривания сделки в будущем.", "alt": ""}, {"s": "Опека", "q": "Деньги на счетах детей, можем ли дать свои рекомендации и указать желаемые сроки на выделение долей?", "a": "Максимум 30 дней на выделение долей и необходимо отчитаться в опеке, предоставив документы после регистрации.", "alt": ""}, {"s": "Опека", "q": "Выделение долей в строящемся жилье или готовом- есть какие-либо отличия или особенности?", "a": "Разницы нет, условия по выделению одинаковые, но степень готовности строящегося жилья от 70%", "alt": ""}, {"s": "Опека", "q": "Можно ли родителям воспользоваться средствами на счетах детей, если уже выделили доли в новой квартире?", "a": "Только на улучшение жилищных условия или дорогостоящее медицинское обследование/лечение, но сначала необходимо предоставить все подтверждающие документы в опеку, только после этого будет готов приказ и можно будет снять. После того, как средства будут потрачены- нужно еще раз предоставить в опеку подтверждающие документы, что средства были направлены на эти цели.", "alt": ""}, {"s": "Опека", "q": "Можно ли потратить средства на счетах детей на другие цели?", "a": "Нет, только на улучшение жилищных условий или на медицинское обследование/лечение. Либо дождаться 18-летия ребенка и он сможет самостоятельно распоряжаться деньгами на свое усмотрение.", "alt": ""}, {"s": "Опека", "q": "После достижения 18 лет нужно ли будет предоставлять какие-то документы в опеку, чтобы снять деньги?", "a": "Ничего не нужно будет предоставлять, теперь у совершеннолетнего ребенка полный доступ к средствам и он их может потратить на любые цели.", "alt": ""}, {"s": "Опека", "q": "Продали готовое жилье, выделять доли обязательно в готовом жилье или можно в строящемся?", "a": "Можно и в строящемся, главное, чтобы ребенку было где жить. Необходимо будет предоставить договор найма, если будут проживать в съемной квартире до момента готовности строящегося жилья. Либо можно предоставить документы на квартиру родственников, если во время строительства проживание у них (например- бабушка, дедушка, братья, сестры), дополнительно необходимо будет предоставить объяснение в опеку, что обеспечили ребенка местом проживания ребенка на период строительства.", "alt": ""}, {"s": "Опека", "q": "Рассрочка по ДДУ/ДКП (различий нет), в договоре указана только мама(папа), средства на счетах детей, хотят эти средства потратить на погашение задолженности в счет последнего платежа. Одобрите перевод средств?", "a": "Только при условии выделения долей детям, просто маме на счет - не согласуют.", "alt": ""}, {"s": "Опека", "q": "Если мы выделим долю по уступке в данном случае?", "a": "Необходимо заблаговременно (еще до выделения долей) предоставить в органы опеки предварительный договор уступки на согласование и одобрение. Если это ипотечная сделка, то необходимо предоставить еще разрешение от банка на выделение долей. Далее идет индивидуальное рассмотрение, если одобрят, то необходимо будет зарегистрировать уступку и средства будут перечислены со счетов детей.", "alt": ""}, {"s": "Опека", "q": "От чего зависят формулировки в приказе опеки? У кого-то указывается, что обязательно именно выделение долей в новой квартире, у кого-то деньги на счетах детей. У кого-то указано или выделение или деньги на счетах детей. На что ориентироваться?", "a": "Каждый случай рассматривается индивидуально, поэтому нет возможности озвучить общие условие. У каждой семьи свои особенности и нюансы. Поэтому и приказы отличаются друг от друга.", "alt": ""}, {"s": "Опека", "q": "Смогут ли дать опекунам (родители погибли) разрешение на распоряжение детскими счетами? Есть ограничения, раз они не кровные родители?", "a": "Действуют те же самые условия, каждая ситуация рассматривается индивидуально.", "alt": ""}];
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let sec='Все',open=false;
const secs=['Все',...new Set(D.map(d=>d.s))];
D.forEach(d=>d.n=norm(d.q+' '+d.a+' '+d.alt));
function hl(t,ws){let h=esc(t);if(ws.length){const r=new RegExp('('+ws.map(w=>rx(esc(w)).replace(/е/g,'[её]')).join('|')+')','gi');h=h.replace(r,'<mark>$1</mark>')}
 return h.replace(/(https?:\/\/[^\s<]+)/g,u=>{const l=u.replace(/<\/?mark>/g,'');return '<a href="'+l+'" target="_blank" rel="noopener">'+u+'</a>'})}
function render(){
 const ws=norm($('q').value).split(/\s+/).filter(Boolean);
 $('x').style.display=ws.length?'block':'none';
 const r=D.filter(d=>(sec=='Все'||d.s==sec)&&ws.every(w=>d.n.includes(w)));
 $('cnt').textContent='Найдено: '+r.length+' из '+D.length;
 let h='',cur=null;
 if(!r.length)h='<div class="em">Ничего не найдено.<br>Попробуйте другое слово или уберите фильтр раздела.</div>';
 r.forEach((d,i)=>{
  if(sec=='Все'&&d.s!=cur){cur=d.s;h+='<h2>'+esc(cur)+'</h2>'}
  const auto=ws.length&&r.length<=5||open;
  h+='<details'+(auto?' open':'')+'><summary>'+hl(d.q,ws)+'</summary><div class="an"><div class="lab">Ответ</div><p>'+hl(d.a,ws)+'</p>'+
  (d.alt?'<div class="alt"><div class="lab">Альтернативный вариант ответа</div><p>'+hl(d.alt,ws)+'</p></div>':'')+
  '<button class="cp" data-i="'+D.indexOf(d)+'">Копировать ответ</button></div></details>'});
 $('list').innerHTML=h;$('tg').style.display=r.length?'':'none'}
$('chips').innerHTML=secs.map(s=>'<button class="chip'+(s==sec?' on':'')+'" title="'+esc(s)+'" data-s="'+esc(s)+'">'+esc(s)+'</button>').join('');
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sec=b.dataset.s;[...$('chips').children].forEach(c=>c.classList.toggle('on',c===b));const k=$('chips');k.scrollTo({left:b.offsetLeft-(k.clientWidth-b.offsetWidth)/2,behavior:'smooth'});render();window.scrollTo({top:0,behavior:'smooth'})};
const K=$('chips'),W=$('cw');
function ed(){W.classList.toggle('l',K.scrollLeft>4);W.classList.toggle('r',K.scrollLeft<K.scrollWidth-K.clientWidth-4)}
K.addEventListener('scroll',ed,{passive:true});addEventListener('resize',ed);
$('la').onclick=()=>K.scrollBy({left:-K.clientWidth*.7,behavior:'smooth'});
$('ra').onclick=()=>K.scrollBy({left:K.clientWidth*.7,behavior:'smooth'});
K.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){K.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
let dx=0,ds=0,dm=false;
K.addEventListener('pointerdown',e=>{if(e.pointerType=='mouse'){dx=e.clientX;ds=K.scrollLeft;dm=false;K._d=true}});
addEventListener('pointermove',e=>{if(K._d){const m=e.clientX-dx;if(Math.abs(m)>5){dm=true;K.classList.add('drag')}if(dm)K.scrollLeft=ds-m}});
addEventListener('pointerup',()=>{K._d=false;setTimeout(()=>K.classList.remove('drag'),0)});
K.addEventListener('click',e=>{if(dm){e.stopPropagation();e.preventDefault();dm=false}},true);
setTimeout(ed,50);
$('q').oninput=render;$('x').onclick=()=>{$('q').value='';render();$('q').focus()};
$('tg').onclick=()=>{open=!open;document.querySelectorAll('details').forEach(d=>d.open=open);$('tg').textContent=open?'Свернуть все':'Раскрыть все'};
$('list').onclick=e=>{const b=e.target.closest('.cp');if(!b)return;const t=D[b.dataset.i].a;
 const ok=()=>{b.textContent='Скопировано ✓'};
 (navigator.clipboard?navigator.clipboard.writeText(t).then(ok,()=>{}):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(_){}a.remove()})};
render();
</script></body></html>
