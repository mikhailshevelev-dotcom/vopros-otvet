<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171b24;--card:#212733;--tx:#eceef4;--mut:#9aa2b5;--ln:#323a4a;--pu:#d65fc2;--soft:#33243a;--hl:#6b5a14}}
:root[data-theme=dark]{--bg:#171b24;--card:#212733;--tx:#eceef4;--mut:#9aa2b5;--ln:#323a4a;--pu:#d65fc2;--soft:#33243a;--hl:#6b5a14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 Montserrat,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header:after{content:"";display:block;height:4px;background:var(--g)}
.w{max-width:900px;margin:0 auto;padding:0 16px}
.top{padding:16px 0 12px}.logo{height:26px;max-width:80%;display:block;margin-bottom:10px}
h1{font-size:20px;line-height:1.25;margin:0 0 12px;font-weight:600}
.sb{position:relative}.sb input{width:100%;padding:13px 40px 13px 44px;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--ln);border-radius:12px;outline:0}
.sb input:focus{border-color:var(--pu)}.sb svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.sb button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;display:none;padding:4px 8px}
.cw{position:relative;margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;cursor:grab;user-select:none}
.chips::-webkit-scrollbar{display:none}
.chips.drag{cursor:grabbing;scroll-snap-type:none}
.cw.l .chips{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px);mask-image:linear-gradient(90deg,transparent,#000 40px)}
.cw.r .chips{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.cw.l.r .chips{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--pu);font-size:18px;line-height:1;cursor:pointer;display:none;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ar.a{left:-4px}.ar.b{right:-4px}
@media(hover:hover){.cw.l .ar.a,.cw.r .ar.b{display:block}}
.chip{flex:none;scroll-snap-align:start;max-width:230px;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 13px;font:500 13px Montserrat,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pu);border-color:var(--pu);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;color:var(--mut);font-size:13px}
.bar button{border:0;background:none;color:var(--pu);font:600 13px Montserrat,system-ui,sans-serif;cursor:pointer}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--pu);margin:22px 0 8px;font-weight:700}
details{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;overflow:hidden}
details[open]{border-color:var(--pu)}
summary{list-style:none;cursor:pointer;padding:14px 44px 14px 16px;font-weight:600;position:relative;overflow-wrap:anywhere}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:16px;top:10px;font-size:22px;color:var(--pu);font-weight:400}
details[open] summary:after{content:"–"}
.an{padding:0 16px 16px;overflow-wrap:anywhere}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 4px;font-weight:600}
.an p{margin:0 0 10px;white-space:pre-line}
.alt{border-left:4px solid;border-image:var(--g) 1;background:var(--soft);padding:10px 12px;margin-top:6px}
.an a{color:var(--pu)}
.cp{border:1px solid var(--ln);background:none;color:var(--mut);border-radius:8px;padding:5px 11px;font:500 12px Montserrat,system-ui,sans-serif;cursor:pointer}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.em{text-align:center;color:var(--mut);padding:40px 10px}

<script>
const D=[{"s": "Общие по проекту", "q": "Есть ли подтверждающие документы что Муллина Наталья Алексеевна, временно исполняющая обязанности нотариуса нотариального округа город Тюмень Тюменской области Аминова Хакима Хамитовича имеет право выдавать доверенности?", "a": "Всю информацию по нотариусам можно проверить на сайте нотариальной палаты, а так же по номеру доверенности можно проверить ее действительность. Застройщик не регулирует полномочия нотариусов так как это государственный орган. Ссылка для проверки https://minjust.gov.ru/ru/pages/reestr-notariusov-rossijskoj-federacii/", "alt": "Муллина Наталья Алексеевна зарегистрирована в реестре нотариусов Минюста РФ (№ 72/183, Тюменская область) как лицо, сдавшее квалификационный экзамен, что позволяет ей временно исполнять обязанности нотариуса в случае отсутствия основного специалиста. \nВременный исполняющий обязанности нотариуса (в нотариальном округе Аминова Хакима Хамитовича) имеет полные полномочия на совершение всех нотариальных действий, включая выдачу доверенностей, согласно ст. 16 Основ законодательства РФ о нотариате — приравнивается к нотариусу по объёму прав. Она активно удостоверяет документы (заверения залогов в ЕГРЮЛ), что подтверждает статус. \nhttps://minjust.gov.ru/ru/pages/reestr-notariusov-rossijskoj-federacii/"}, {"s": "Общие по проекту", "q": "Есть ли подтверждающие документы что Муллина Наталья Алексеевна, временно исполняющая обязанности нотариуса нотариального округа город Тюмень Тюменской области Аминова Хакима Хамитовича имеет право выдавать доверенности?", "a": "Страна Девелопмент — это коммерческое название группы компаний. В соответствии с 214 ФЗ ст 12.1 застройщик (как юридическое лицо) имеет право вести строительства только в рамках одного разрешения на строительство. Поэтому Минстрой и надзорные органы трактуют норму как обязанность создавать отдельное юрлицо под каждый объект. Сейчас у любого застройщика имеется отдельное юр лицо на каждый ЖК", "alt": "В преамбуле ДДУ указывают ООО \"Городок\", потому что именно эта компания зарегистрирована как застройщик в реестре 214-ФЗ и имеет прямые права на земельный участок, разрешения на строительство и эскроу-счета — в отличие от \"Страна Девелопмент\", которая выступает управляющей или материнской компанией без статуса непосредственного участника долевого строительства."}, {"s": "1. Правовое обоснование договора", "q": "Какие последствия того, что земля на которой строится многоквартирный дом не принадлежит застройщику, а находится в аренде? что будет после его окончания?", "a": "Земельный участок, на котором расположены многоквартирный дом и иные входящие в состав такого дома объекты недвижимого имущества, переходит бесплатно в общую долевую собственность собственников помещений в многоквартирном доме. Если участок не был сформирован до вступления в действие ЖК РФ, то он становится собственностью владельцев квартир с момента формирования и проведения государственного кадастрового учета. Договор аренды не предоставляем, т.к. это документ-основание огранизации, содержащий персональные данные, которые мы не может направить . Выписку на земельный участок вы можете заказать самостоятельно, в выписке будет отражаться вся необходимая информация. Можно зайти на сайт Росреестра, ввести кадастровый номер участка и там будет указана вся необходимая информация, с которой можно ознакомиться.", "alt": "1- Ключевой момент: \n\n2- земля в аренде у застройщика, а не в собственности, не создаёт проблем собственникам после ввода дома и регистрации прав — участок переходит в их общую долевую собственность, а аренда прекращается автоматически"}, {"s": "1. Правовое обоснование договора", "q": "Просьба разъяснить правовое обоснование договора, в части права субаренды, что означает субаренда в данном договоре?", "a": "Собственником земли является РФ, а так как РФ сами не могут реализовывать строительство, то они отдали в аренду эту землю ТОДЭП для реализации стройки, тодэп в свою очередь под субаренду отдали нам. поэтому обременение тодэп идет автоматом на землю/ Земельный участок принадлежит Застройщику на основании договора Субаренды, где Арендатором является АО ТОДЭП, а Застройщик Субарендатором.", "alt": "Земля находится в собственности Российской Федерации, которая передала её в аренду АО «ТОДЭП» для строительства. Затем ТОДЭП предоставил участок нашей организации в субаренду. Таким образом, земельный участок используется застройщиком на основании договора субаренды, заключённого с АО «ТОДЭП»."}, {"s": "1. Правовое обоснование договора", "q": "Где можно посмотреть проектные РЕШЕНИЯ ?", "a": "Можете воспользоваться общедоступной информацией на сайте Наш.ДОМ.РФ. С иной информацией можно ознакомиться по предварительному запросу в офисе застройщика. Без фото и видео съемки. Проектные решения являются нашей интеллектуальная собственность.", "alt": ""}, {"s": "1. Правовое обоснование договора", "q": "ЖК Страна Береговая: 1.2. Правовым основанием для заключения Договора является:\n- ПРОТОКОЛ № 2 о результатах публичных торгов по продаже арестованного (заложенного) имущества, от 24.11.2022, заключенный с Территориальным управлением Федерального агентства по управлению государственным имуществом в Новосибирской области, на земельный участок с кадастровым номером: 54:35:032516:7, категория земель: земли населенных пунктов, адрес (описание местоположения): Новосибирская обл, г Новосибирск, ул 2-я Сухарная Береговая. На земельном участке расположено административное здание, 284 А, номер и дата государственной регистрации собственности: 54:35:032516:7-54/167/2023-46 от 06.02.2023. \n- Разрешение на строительство № 54-35-139-2024 от 30.08.2024 г., выданное Мэрией города Новосибирска.", "a": "На данном зем участке когда то было здание у прежнего собственника (на которое не было оформлено право собственности). Протокол о публичных торгах, по результатам торгов застройщик (страна м3- в настоящее время страна.новосибирск) приобрела права на данный зем участок. \n\nСейчас этого здания нет и на данном зу идет строительно мкд. \nВыданы документы на строительство нашего дома", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "п 2.2 - материал поэтажных перекрытий, класс энергоэф-ти и сейсмостойкости- нет данных. Почему?", "a": "Сейсмостойкость или сейсмическая приспособленность - характеристика зданий и сооружений, описывающая степень их устойчивости к землетрясениям в пределах допустимого риска. По данной категории нет показателей, т.к. ОН строятся в регионе, где нет данных природных катаклизмов.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.3. Площадь с балконом", "a": "В соответствии с п. 2.3 Договора долевого участия \"Общая приведенная проектная площадь Объекта долевого строительства определяется как сумма проектной общей площади Объекта долевого строительства и площадей, расположенных в Объекте долевого строительства лоджий с учетом понижающего коэффициента 0,5 и/или балконов, террас с учетом понижающего коэффициента 0,3.\", из чего следует, что площадь, указанная в ДДУ и площадь, указанная в Приложении 1 к Договору -верная, т.к. в п.2.3 Договора площадь рассчитывается с учётом понижающего коэффициента. Данная информация указывается в Договоре в соответствии с требованиями Жилищного Кодекса. Площадь балконов в Договоре долевого участия указана с учётом понижающего коэффициента 0,9*0,3=0,24, 1,23*0,3=0,37. На сайте площадь квартиры указывается без понижающего коэффициента балконов. Общая площадь квартиры при этом не меняется 60,45 (на сайте без понижающего коэффициента балконов) 58,96 (В договоре долевого участия с учётом понижающего коэффициента).", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "В п.2.4. нет упоминания о лоджии, при встрече мы этот вопрос не оговорили. Что с ремонтом лоджии?? Если он будет - почему ремонт не описан в п.2.4. договора?", "a": "Ремонт в лоджию не входит, там будет ровная стяжка пола", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "В п.2.4. после указания цвета и отделки квартиры содержится условие, о том, что фактический результат работ может отличаться в части ОТТЕНКОВ цветовой гаммы. п.2.4.Почему описание является ориентировочным и может быть изменено/дополнено подрядной организацией и/или Застройщиком без предварительного согласования и уведомления Участника долевого строительства", "a": "Вариант 1. Производитель может прекратить поставки в Россию либо производство, производитель вправе менять оттенок и цвет , изменить материалы. \nВариант 2. Потому что к моменту ввода дома в эксплуатацию, поставщики материалов и подрядчики могут измениться и будут внесены несущественные коррективы. Что никак не повлияет на качество и внешний вид.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. почему площадь кухни делится на жилое и вспомогательное", "a": "Нормами СП предусмотрено выделение кухни-ниши. Мокрые зоны над жилыми комнатами располагать запрещается, так как это ухудшает жилищные условия соседям снизу, вследствие нарушения санитарных норм.", "alt": "В студиях и «кухнях‑гостиных» БТИ и проектировщик часто условно размежёвывают помещение: метры у плиты и мойки относят к вспомогательным, остальную часть — к жилым, чтобы соблюсти минимальные требования к жилой площади и корректно вести учёт для расчёта норм обеспеченности жильём (сколько метров жилой площади на человека) и соблюдения строительных норм (минимальные площади жилых комнат)."}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Есть вопрос к самому договору, а именно к тому, что включает в себя отделка (п.2.4). В ДДУ вы называете это черновой отделкой, на своем сайте - предчистовой.", "a": "Вариант 1 Компания Страна Девелопмент работает в соответствии с Федеральным законом \"Об участии в долевом строительстве многоквартирных домов и иных объектов недвижимости и о внесении изменений в некоторые законодательные акты Российской Федерации\" от 30.12.2004 N 214-ФЗ. Договор Долевого Участия (далее-ДДУ) составлен в соответствии с данным Федеральным законом. В связи с тем, что в Законе отсутствует формулировка «предчистовая отделка», мы не можем указать данную формулировку в ДДУ. Законом предусмотрена формулировка «Черновая отделка», которую мы указываем в Договоре, и далее, в п. 2.4. «Техническое состояние Объекта долевого строительства на момент передачи Участнику долевого строительства», указываем все параметры, которые обязуемся выполнить к дате завершения строительства. Форма ДДУ утверждена банками и Росреестром, корректировки в ДДУ мы не вносим т.к. банки не согласуют Объект, а Росреестр не зарегистрирует право собственности по Договору, в который внесены изменения. Работа Девелопера жестко регламентирована законодательством, мы ограничены в некоторых моментах. \nВариант 2 Понятие улучшеная черновая отделка в юридической теминологии отсутствует. В дду расписано что включает в себя отделка.", "alt": "1. В ДДУ фиксируется минимально гарантированный уровень отделки — «черновая», потому что по 214‑ФЗ застройщик обязан выполнить не меньше этого объёма работ. Фактически мы передаём квартиры в более высоком стандартe — предчистовой (white box), с выровненными стенами, стяжкой и подготовкой под финишную отделку."}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Потолок: без отделки/ выровнен. \n- Правильно ли я понимаю, что \"выравнивание\" это само собой разумеющаяся вещь?", "a": "2.4. В соответствии с проектной документацией потолок выполнен из монолитных, бесшовных плит.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Стены: оштукатурены/ оштукатурены (в т.ч. откосы на окнах) + усиленная звукоизоляция межквартирных стен. - Подразумевает ли штукатурка стен штукатурку оконных откосов?", "a": "2.4. Да, в соответствии с проектной документацией оконные откосы будут оштукатурены. (уточняем у МОП будут ли в данном ЖК они отштукатурены)", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Почему в ДДУ нет упоминания про шумоизоляцию? Для пола соответствующее упоминание есть. прошу включить упоминание шумоизоляции в пункт по отделке.", "a": "Вариант 1 В соответствии с проектной документацией, в наружных стенах предусмотрено утепление минераловатными плитами толщиной 120 и 150 мм. В межквартирных стенах перегородки толщиной 200 мм из силикатных блоков толщиной 80 мм в два слоя с заполнением между ними минераловатными плитами. Минераловатная плита является хорошим шумоизолирующим материалом, а также обладает низкой теплопроводностью и поддерживает оптимальный микроклимат в квартире. (уточняем у МОП данные по ЖК)\nВариант 2 Указано в проектной декларации, она размещена на сайте нашдом.рф в общем доступе", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Установка приборов отопления – в соответствии с проектными решениями\" ; - на сайте прописано что радиаторы будут установлены, почему в договоре не указано?", "a": "По поводу приборов отопления и электроснабжения, все данные прописаны подробно в проектной декларации", "alt": "Зачастую застройщики используют обобщённые формулировки в договорах долевого участия, чтобы иметь возможность оперативно вносить небольшие изменения в проект (тип радиаторов, количество секций, точные модели и т.п.) без необходимости повторного подписания документов всеми участниками. Это позволяет обеспечить комфорт и удобство как самим дольщикам, так и строительной компании, минимизируя бюрократические процедуры и сохраняя высокое качество работ."}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Ванна/душевой поддон", "a": "так как объект является строящимся и, если изначально заложена маленькая площадь с/у, то при сдаче ванна может не войти. Поэтому решено писать то или то. При точечных моментах можно уточнять что именно будет установлено у стройки, но на это надо время и не всегда даже они могут ответить на 100%. Обычно поддон может быть в маленьких студиях, где маленький туалет", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "В п.2.4. есть условие: \"Во втором санитарном узле (для варианта квартир с двумя санитарными узлами), кухне, кухне-нише – сантехническое оборудование не устанавливается, разводка сетей водоснабжения/водоотведения не осуществляется\" Но у нас будет ремонт в кухне. Как же разводка сетей и установка раковины и смесителя?", "a": "Все трубы есть, но подключаете все самостоятельно. шланги идут в комплекте, но ничего не подключается. Раньше подключали все, сейчас не входит", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Будут ли согласовыватся вывод розеток с клиентом", "a": "Розетки установлены с учетом расстановки мебели. Индивидуально мы не вносим корректировки.", "alt": "1. - На этапе строительства застройщик обязан придерживаться утверждённого проекта и типовых решений.\n2. - Закон о долевом строительстве требует, чтобы застройщик передал объект в соответствии с проектной документацией и описанием отделки. Нельзя согласовывать вывод розеток с каждым дольщиком на этапе строительства из‑за совокупности нормативных, технических и юридических причин."}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Окна: установка оконных блоков из ПВХ/ окна с клапаном приточной вентиляции Air-Box комфорт.- Почему нет упоминания клапана?", "a": "В ходе строительства могут измениться подрядчики, поставщики или используемые материалы (без ухудшения качества), в связи с этим в ДДУ не указываются наименования производителей и строительных материалов. Клапан Air-Box –это коммерческое название воздушного клапана, используемое некоторыми фирмами производителями. Воздушный клапан на окнах предусмотрен и будет установлен в соответствии с проектной документацией, т.к. является неотъемлемой частью вентиляции воздуха в квартире", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. Проектные решения по связи, электрике и другой инфраструктуре нам будут выдаваться с ключами? Чтобы можно были в дальнейшем пользоваться в случае каких-либо перепланировок/изменений и т. д", "a": "Экспликация, планы разводки отопления и электроэнергии будут размещены в свободном доступе на сайте управляющей компании после ввода дома в эксплуатацию.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "п.2.4: Непонятно, что такое типовая отделка — её нигде нет, кроме сайта и буклетов", "a": "с типовой отделкой можно ознакомиться в офисе продаж жилого комплекса.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "п.2.4. Стены будут оштукатурены под поклейку обоев? Или их ещё необходимо будет шпаклевать?", "a": "Застройщик осуществляет пред чистовую отделку: стены оштукатурены, выровнены под маяк и готовы для оклейки обоями.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "Просят предоставить точные размеры стен в квартире еще на этапе строительства", "a": "У нас нет точных размеров, они появляются только на этапе ввода дома и при замере кадастровым инженером. Так как дом строится, то параметры могут меняться и если мы выдадим данные из ар и человек закажет себе кухню, а при сдаче будет разница в 5 см, то кухня может не войти (как пример)", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "В п.2.4. есть условие: \"Во втором санитарном узле (для варианта квартир с двумя санитарными узлами), кухне, кухне-нише – сантехническое оборудование не устанавливается, разводка сетей водоснабжения/водоотведения не осуществляется\" Но у нас будет ремонт в кухне. Как же разводка сетей и установка раковины и смесителя?", "a": "Все трубы есть, но подключаете все самостоятельно. шланги идут в комплекте, но ничего не подключается.", "alt": "Второй санузел в проекте часто закладывается как функциональное помещение «на выбор», поэтому застройщик ограничивается инженерными выводами, а не ставит туда полный комплект сантехники по умолчанию. Сейчас кто‑то делает там второй санузел, кто‑то постирочную, кладовую или гардеробную, поэтому застройщик не навязывает конкретную конфигурацию."}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.4. почему не прописывается наличие/отсутствие \"Умного дома\"", "a": "", "alt": "214 Ф.Закон об участии в долевом строительстве требует, чтобы в договоре были обязательно зафиксированы:объект (квартира, её площадь, планировка);цена, сроки, гарантии;описание уровня отделки и инженерных систем в объёме, предусмотренном проектной документацией.​\nСистема:«Умный дом» юридически рассматривается как дополнительный сервис/оборудование, а не как обязательный элемент объекта долевого строительства. \nПоэтому застройщики обычно раскрывают информацию о ней в рекламе, на сайте и в буклетах."}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "Умный дом: - / система умный дом.- Что конкретно входит в состав системы и почему это никак не упоминается в ДДУ?", "a": "\"Базовый\" пакет системы умный дом включает в себя функции \n1) Включение и выключение электричества в квартире (WiFi роутер и холодильник всегда с электричеством)\n2) Защита от протечки воды (включает в себя датчики протечки и клапан перекрытия воды)\nГоловное устройство (планшет для управления системой «умный дом»).", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.5. в случае расхождения площади если она меньше , возврат денежных средств не предусмотрен ? И так же в случае ее увеличения никаких доплат ?", "a": "В случае если по данным обмеров уполномоченной организации расхождение проектной общей площади объекта долевого строительства составит более 5% от площади, указанной в ДУДС, то у Вас, согласно ст.9. 214-ФЗ, есть право на расторжение в одностороннем порядке. Так же Вы сможете написать претензию на имя Застройщика и вопрос будет решаться в индивидуальном порядке.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.5.5% - очень большая погрешность. Оптимально для всех сторон в ДДУ указать 0.5-1 м2 погрешности и далее перерасчет стоимости в обе стороны", "a": "Компания Страна Девелопмент работает в соответствии с Федеральным законом \"Об участии в долевом строительстве многоквартирных домов и иных объектов недвижимости и о внесении изменений в некоторые законодательные акты Российской Федерации\" от 30.12.2004 N 214-ФЗ. Федеральным законом об участии в долевом строительстве установлено допустимое отклонение проектной и фактический площади на 5%", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.5. в соответствии с чем указаны такие критерии 5% при расхождении", "a": "5 % указывается на основании 214 ФЗ. То есть если у клиента расхождение больше 5%, то он может расторгнуть договор или через претензию попросить перерасчета. Все что до 5% считается нормой, так как они приобретают строящийся объект и может быть расхождение. Точную площадь они могут знать только при покупке готового жилья по договору купли-продажи", "alt": "Порог 5% установлен самим законом о долевом строительстве — 214‑ФЗ. В нём закреплено, что изменение фактической площади квартиры по сравнению с проектной в пределах 5% не считается существенным нарушением условий договора. Именно поэтому в ДДУ указывают этот предел: до 5% площадь может немного отличаться по результатам обмеров БТИ, и порядок перерасчёта цены (или его отсутствия) стороны определяют в договоре. Если же отклонение превышает 5%, это уже считается существенным изменением, и у дольщика появляются дополнительные права — вплоть до возможности расторгнуть договор или оплачивать только часть «лишних» метров."}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "2.5. возможно предусмотреть перерасчет цены договора в связи с изменением площади квартиры, установить порядок и сроки выплаты денежных сумм расхождения между проектной и фактической площади квартиры", "a": "Пункт 2.5 Договора сформулирован согласно статье 9 ФЗ 214 в соответствии с которым Участник долевого строительства в одностороннем порядке вправе отказаться от исполнения договора в случае: существенного изменения проектной документации строящихся (создаваемых) многоквартирного дома и (или) иного объекта недвижимости, в состав которых входит объект долевого строительства, в том числе превышения допустимого изменения общей площади жилого помещения или площади нежилого помещения, являющихся объектом долевого строительства, которое может быть установлено в договоре в размере не более пяти процентов от указанной площади Вариант 2 В случае, если изменение фактической площади помещения будет отличаться в пределах 5% в меньшую сторону от заявленной проектной площади в договоре, мы не производим перерасчёт цены договору.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "П 2.5. Прокомментируйте пожалуйста. Почему могут не совпадать?", "a": "Отклонения и несовпадения могут быть только в пределах нормы, указанной в ФЗ-214. Отклонения могут быть в связи с тем, что объект сейчас находится на стадии строительства и не имеет чётких параметром. При строительстве могут быть отклонения, например, в площади в см. или в толщине штукатурки в мм. После окончания строительства производятся замеры объекта недвижимости и сверяются с проектной документацией", "alt": "На этапе проектирования площадь считается «по чертежу», а после строительства — по фактическим обмерам БТИ/кадастрового инженера, с учётом толщины отделки, выравнивания стен, стяжки полов, реальной геометрии стен и углов. Все эти факторы могут дать разницу в несколько процентов, поэтому законом и заложен допустимый коридор до 5% между проектной и фактической площадью, чтобы не считать такие отклонения нарушением."}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "предусмотрена ли установка домофонного оборудования в квартире или это уже осуществляется за свой счет", "a": "С домофона видеозвонок поступает в мобильное приложение и головное устройство (планшет) в квартиру.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "Ремонт во втором санузле", "a": "В сан узле меньшей квадратуры на полу будет плитка, на стенах обои, без сан техники, все выводы будут спрятаны в люки. Потолки натяжные с точечными светильниками. Так же клиент может приоьрести ремонт во втором санузле, либо выбрать, в каком из двух санузлов сделать ремонт", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "Фиксация скрытых работ будет производиться и предоставляться нам перед подписанием акта приема-передачи?", "a": "Скрытые работы проводятся на основании проектной документации. После приема-передачи квартиры ответственность за вмонтированные в стену трубы несет УК.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "Почему не указан кондиционер?", "a": "Дело в том, что в ДДУ прописывается сам объект и его характеристики, а Кондиционер является доп.опцией от застройщика, банки отказываются кредитовать доп.опции, они выдают ипотеку именно на саму квартиру. Но не переживайте, мы федеральный застройщик и дорожим своей репутацией, поэтому дома сдаем всегда в том виде, в котором обещаем, у нас абсолютно в каждой квартире с ремонтом устанавливается кондиционер, введенных в эксплуатацию объектов у нас более 30, везде установлено то, что обещали.", "alt": ""}, {"s": "2. Предмет договора (техническое состояние объекта долевого)", "q": "интересует приборы передачи показаний счетчиков и система перекрытия стояков в случае протечек", "a": "Телеметрия уже есть в каждой квартире по умолчанию (автоматическая передача данный в УК). Дополнительно её не нужно устанавливать.\nЕсли интересует автоматическое перекрытие воды, то это Умный Дом \"Базовый\".\nПакет \"Базовый\" включает в себя функции включение и выключение электричества в квартире (WiFi роутер и холодильник всегда с электричеством). Защита от протечки воды - датчик протечки и клапан перекрытия воды. Все устройства работают через WiFi.", "alt": ""}, {"s": "3. Цена договора (оплата)", "q": "Пропишите цену кв.м/ Хотят добавить в ДДУ", "a": "Шаблон Договора участия в долевом строительстве (типовой и един для всех Участников долевого строительства. ДУДС согласован Росреестром, ГУСом, эскроу- агентом. Шаблон ДУДС размещен на сайте ЕИЖС и изменению и внесению правок не подлежит. ДУДС составлен в соответствии с требованиями Закона 214-ФЗ. Любые изменения могут грозить приостановкой регистрации в Росреестре.", "alt": "В договоре указывается общая стоимость квартиры, потому что именно она является предметом ДДУ по 214‑ФЗ. Цена за квадратный метр — это расчётный показатель, который мы используем в коммерческом предложении и в рекламных материалах, но закон не требует фиксировать её в договоре. Все права клиента защищает общая цена и точная площадь, указанная в ДДУ."}, {"s": "3. Цена договора (оплата)", "q": "Пункт 3.2.5 Срок условного депонирования денежных средств. Почему дата отличается от даты перечисления денежных средств", "a": "Данная дата является условной и означает дату перечисления ДС со счета эскроу застройщику", "alt": "Дата окончания срока условного депонирования и дата фактического перечисления денег – это разные юридические события, поэтому они не совпадают. \nСрок условного депонирования — это период, в течение которого деньги по ДДУ хранятся на эскроу‑счёте и недоступны ни дольщику, ни застройщику. Закон устанавливает, что этот срок привязан к сроку ввода дома в эксплуатацию и не может превышать его более чем на шесть месяцев (ст. 15.5 214‑ФЗ)."}, {"s": "3. Цена договора (оплата)", "q": "п.3.10: Не понимаю. Срок на перевод с Домклик на Эскроу — 3 дня после регистрации и оформления залога. (п.3.3.3). Как здесь может идти речь о вводе дома в эксплуатацию или каком-то неполном переводе?", "a": "В данном пункте говорится о ситуации, при которой дольщик вовремя не переводит денежные средства. В случае, если вся сумма денежных средств (стоимость квартиры) не поступила на счёт ЭСКРОУ до ввода дома в эксплуатацию, то после ввода дома, дальнейшие расчёты производятся уже на счёт застройщика", "alt": ""}, {"s": "3. Цена договора (оплата)", "q": "Почему не указываем эскроу счет в ДДУ (сделки не с МСК)", "a": "Шаблон Договора участия в долевом строительстве (типовой и един для всех Участников долевого строительства. ДУДС согласован Росреестром, ГУСом, эскроу- агентом. Шаблон ДУДС размещен на сайте ЕИЖС и изменению и внесению правок не подлежит. ДУДС составлен в соответствии с требованиями Закона 214-ФЗ. Любые изменения могут грозить приостановкой регистрации в Росреестре.", "alt": "Закон о долевом строительстве (214‑ФЗ) требует, чтобы в ДДУ было указано условие, что расчёты по договору осуществляются через счёт эскроу, но сам счёт открывается отдельным договором с банком . Поэтому в договоре фиксируется способ оплаты — «через счёт эскроу в уполномоченном банке», а конкретный номер счёта и его реквизиты указываются не в ДДУ, а в договоре счёта эскроу, который вы подписываете в банке. Это общая практика: ДДУ описывает обязательства по объекту и способу расчётов, а банковские детали оформляются в отдельном документе с кредитной организацией"}, {"s": "3. Цена договора (оплата)", "q": "Расходы по регистрационным действиям по памятке оплачивать нам не нужно, а в договоре написано что нужно.", "a": "Все расходы по электронной регистрации также несёт Застройщик, то есть оплачивает гос. пошлины за регистрацию договора долевого участия и электронную регистрацию.", "alt": "Все затраты, связанные с электронной регистрацией, включая уплату государственной пошлины за регистрацию договора долевого участия и проведение самой электронной регистрации, берет на себя Застройщик."}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "п. 4.1: \"Передача Застройщиком и принятие Участником долевого строительства Объекта долевого строительства осуществляется по подписываемому Сторонами акту приема-передачи в течение 90 (девяноста) рабочих почему такая дата, если завершение строительства третий квартал 25 года?", "a": "4.1.По поводу акта, срок сдачи 3 кв 2025г, отсчитывается от последнего месяца, 2 месяца дается администрации на комиссию и выдачу разрешения и с момента получения разрешения 90 дней. Мы большую часть наших домов сдаем на 1-2 квартала раньше.", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "возможна ли приемка другим лицом , в случае не нахождения в городе и нужны ли для этого какие- то документы", "a": "Возможна. Нотариальная доверенность на доверенное лицо с полномочиями на приемку квартиры, получение ключей от квартиры.", "alt": "Приёмка квартиры может быть осуществлена не лично дольщиком, а его представителем. Для этого необходимо оформить нотариальную доверенность, в которой будут прямо указаны полномочия: осмотреть объект, подписать передаточный акт, при необходимости внести замечания и подписать акт с перечнем недостатков. При передаче квартиры застройщик обязан проверить личность представителя и наличие доверенности, после чего передаточный акт, подписанный представителем в пределах полномочий, будет иметь те же юридические последствия, что и подпись самого дольщика (ст. 182–185 ГК РФ)."}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "п. 4. если мне некому оставить доверенность на получение ключей", "a": "Срок принятия объекта недвижимости установлен в соответствии с ФЗ-214. Однако, Застройщик в индивидуальном порядке согласовывает дату с каждым дольщиком. Например, Вам поступило уведомление (звонок) о необходимости записаться на выдачу ключей и подписание акта приёма передачи в январе. Вы можете созвониться (можно даже заранее) со специалистом и озвучить, что Вы можете приехать на подписание акта и получение ключей только в следующем месяце в феврале. Специалист запишет Вас и отметит, что у Вас согласованное ожидание.Застройщик лоялен в дате получения ключей и подписанию актов приёма передачи, так как у многих участников долевого строительства есть жизненные обстоятельства (работа, рождение детей и т. д.)", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "п. 4.1 дом будет сдан в 2025году?", "a": "Согласно п. 4.1. срок завершения строительства многоквартирного дома - IV квартал 2024 года. Выдача ключей осуществляется в течение 90 рабочих дней, то есть до 23.05.2025 года. Данный срок определяется по ФЗ-214, так как выдача ключей происходит по очереди все участникам долевого строительства.", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "4.1. Если будут замечания при приемке квартиры по качеству и составу работ, я подписываю акт о несоответствии с замечаниями?", "a": "В случае, если на приёмке квартиры Вами будут выявлены замечания-сотрудники отдела выдачи помогут оставить заявки на устранение замечаний через приложение «Страна». В нашей компании создана система взаимодействия с отделом гарантии через мобильное приложение «Страна», после приёмки и подписания акта приёма-передачи квартиры, необходимо будет оставить гарантийные заявки на устранение замечаний в мобильном приложении, они поступят в работу ответственным исполнителям, дополнительно можно оставить акт осмотра квартиры с замечаниями составленный на бумажном носителе сотрудникам отдела выдачи.", "alt": "Если при приёмке вы обнаружите замечания по качеству или объёму выполненных работ, вы имеете право подписать акт приёма‑передачи с перечнем недостатков. Для этого составляется акт (или дефектная ведомость), в котором фиксируются все несоответствия: трещины, неровности, недоустановленное оборудование и т.д. Подписание такого акта не лишает вас права требовать устранения дефектов, а наоборот – юридически фиксирует, что квартира передана с недостатками, которые застройщик обязан устранить в разумный срок в рамках гарантийных обязательств (ст. 7, 9, 18 214‑ФЗ и нормы о подряде ГК РФ).​\nПока не согласован ответ"}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "4.2. Как уведомляют о завершении строительства и о готовности Объекта долевого строительства к передаче", "a": "4.2.При вводе дома в эксплуатацию, вас должны пригласить на вручение ключей, совершается звонок, так же поступает уведомление в нашем приложении, на сайте. Если с Вами не смогут связаться, то направляется вам заказное письмо с уведомлением.", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "4.3 Подписание акта пп в срок не позднее 7 дней с момента получения уведомления. Если клиент не успевает в установленный срок принять квартиру", "a": "4.3.застройщик рекомендует оформить доверенность на принятие объекта. В крайних случаях идет на встречу клиенту и ждет пока он сможет принять объект, если же все таки клиент не может оформить ПС в надлежащее время, формируется Односторонний акт и отправляется клиенту", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "4.3 при приёмке объекта мы должны оба присутствовать? Если не получиться принять в течении 7 дней (например муж на вахте, я не смогла отправиться на работе)", "a": "Да, присутствие всех участников сделки обязательно. Срок принятия объекта недвижимости установлен в соответствии с ФЗ-214. Однако, Застройщик в индивидуальном порядке согласовывает дату с каждым дольщиком. Например, Вам поступило уведомление (звонок) о необходимости записаться на выдачу ключей и подписание акта приёма передачи в январе. Вы можете созвониться со специалистом и озвучить, что Вы можете приехать на подписание акта и получение ключей только в следующем месяце в феврале. Специалист запишет Вас и отметит, что у Вас согласованное ожидание.", "alt": "По закону передача квартиры оформляется актом приёма‑передачи, который подписывает участник долевого строительства или его представитель (ст. 8 214‑ФЗ). Если в ДДУ указаны два дольщика, есть два варианта:​\n– оба дольщика лично присутствуют и подписывают акт;\n– один из них принимает квартиру и подписывает акт по нотариальной доверенности от второго. В этом случае представитель действует от имени обоих собственников, и акт имеет полную юридическую силу."}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "4.3. Воможно ли перенсти срок получения ключей, если нас не будет в городе", "a": "п. 4.3 После завершения объекта долевого строительства Вам будет направлено сообщение о завершении строительства и о готовности Объекта долевого строительства к передаче, так же с Вами дополнительно свяжутся специалисты выдачи и пригласят на получение ключей. Вы можете озвучить свои обстоятельства по телефону и со специалистом выдачи согласовать разумный срок переноса.", "alt": "Срок передачи квартиры застройщиком закреплён в ДДУ и менять его нельзя, иначе это будет изменение существенного условия договора. Но если в момент вызова на приёмку вы не можете приехать (в отъезде, командировке и т.п.), есть два варианта:\n– оформить нотариальную доверенность на представителя (супруга, родственника), который примет квартиру и ключи за вас;\n– письменно уведомить застройщика, согласовать другую удобную дату визита. Важно учитывать, что при длительной задержке с вашей стороны застройщик вправе составить односторонний акт передачи, и с этого момента квартира считается переданной юридически, даже если вы фактически ещё не получили ключи."}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "4.9. В договоре не указан срок, в течении которого застройщик обязан устранить замечания, указанные в акте приёма-передачи квартиры.", "a": "Согласно ч. 6 ст.7 ФЗ № 214-ФЗ Застройщик обязан устранить выявленные недостатки (дефекты) в срок, согласованный Застройщиком с Участником долевого строительства. Согласно п.5.5. Договора стороны согласовывают срок для устранения выявленных недостатков. В связи с чем, ч.1 ст.20 Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» не подлежит применению. Срок изменению не подлежит и согласно Договора составляет 90 (девяносто) календарных дней с даты предоставления Участником долевого строительства доступа к Объекту долевого строительства. Срок 90 дней обусловлен тем, что устранение недостатков может быть сопряжено с заменой каких-то элементов отделки, а это как правило длинные заказные позиции. Например, если на стеклопакете обнаружен дефект и требуется замена стеклопакета, то новый стеклопакет может ехать с завода 3 месяца. То же самое касается входных дверей.\nПоэтому, отталкиваясь от реальных сроков поставок, мы указываем срок 90 дней.", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "а крайний срок передачи застройщиком и подписание акта приёма передачи 23.05.2025 г.Почему такой большой разрыв пять месяцев? Больше 90 дней со дня ввода в эксплуатацию. Почему такие сроки не понятные? 4 квартал тоже неконкретная дата?", "a": "Дата окончания строительства и ввода объекта в эксплуатацию определяется проектной документацией, которая находится в общем доступе на сайте наш.дом.рф. Точная дата никогда не указывается, только временной интервал, так как документация готовится не один день и ввод объекта происходит в течение длительного промежутка времени. Выдача ключей происходит строго по графику всем участникам долевого строительства по очереди, так как физически всем выдать ключи и подписать акты приёма передачи в один срок невозможно. Срок в 90 рабочих дней установлен ФЗ-214, который регламентирует долевое строительство. Дата 23.05.2025 верная. Прошу обратить внимание, что по ФЗ-214 учитываются только рабочие дни, без выходных и праздничных дней.", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "4.6. С момента подписания акта приема-передачи риск случайной гибели Объекта долевого строительства признается перешедшим к Участнику долевого строительства.", "a": "Согласно статье 211 Гражданского кодекса РФ, риск случайной гибели или случайного повреждения имущества несёт его собственник, если иное не предусмотрено законом или договором.Риск случайной гибели (повреждения) имущества означает вероятность его уничтожения (уменьшения полезных свойств, товарного вида) по причинам, которые не обусловлены поведением, за которое какое-либо лицо несёт ответственность (например, в результате действия непреодолимой силы).", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "Все-таки не понятен целиком процесс окончания строительства, ввода в эксплуатацию и передачи ключей по датам и оформляемым документам, хотелось бы более четкого понимания процесса", "a": "Даты ввода в эскплуатацию определяется Администрацией города Тюмени, а срок выдачи ключей определяется договором", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "Если дом не сдастся до 27.05.27? Вы будете выплачивать денежные средства за задержку? В каком размере?", "a": "При просрочке сдачи дома высчитывается индивидуально (согласно 214 ФЗ) выплаты. Мораторий освобождает строительные компании от обязанности выплачивать штрафы и компенсации дольщикам за перенос сроков ввода объектов в эксплуатацию и другие связанные неустойки.\nДействие моратория распространяется на все жилые объекты, сроки сдачи которых попадают под зону действия постановления — как начатые ранее, так и новые проекты. Мораторий продлили до конца 2025 года, компенсиции не будет.", "alt": ""}, {"s": "4. Срок и порядок передачи объекта долевого строительства", "q": "П 4.11. Если я не смогу подписать акт по причине нахождения на вахте, т.е. на работе когда вы сообщите о том что нужно принять по акту помещение все равно буду компенсировать затраты?", "a": "Да. Застройщик лоялен в дате получения ключей и подписанию актов приёма передачи, так как у многих участников долевого строительства есть жизненные обстоятельства (работа, рождение детей и т. д.). Однако, финансовые расходы (коммунальные услуги) за содержание жилого помещения (квартиры) Застройщик не несёт в соответствии с ФЗ-214.", "alt": ""}, {"s": "5. Гарантии качества", "q": "5.4. Что понимается под нормальным износом", "a": "5.4. Законодатель не определяет термин «нормального (естественного) износа». В судебной практике под ним понимают ту степень изменения имущества, которая предполагается естественной при его обычном использовании в течение определенного срока", "alt": ""}, {"s": "5. Гарантии качества", "q": "5.5. Не является нарушением требований о качестве Объекта долевого строительства, не считается существенным изменением и не требует согласования с Участником долевого строительства такое изменение проектной документации по строительству многоквартирного дома, которое влечет следующие изменения в многоквартирном доме -что подразумевается?", "a": "Что застройщик вправе поменять незначительно цвет стен в МОП, поставить лавочки, отличающиеся от рендеров, но очень похожие, что озеленение может незначительно поменятся или поменятся расположение диванов в МОП, двери могут быть заменены на другой аналог, но вносится изменения в ПД по этому поводу не будут", "alt": ""}, {"s": "5. Гарантии качества", "q": "п. 5.2, п. 5.3 что входит в технологическое и инженерное оборудование на которые действует гарантия?", "a": "К технологическому и инженерному оборудованию относится оборудование, обеспечивающее работу энергосистем дома: ГВС, ХВС, отопление, вентиляция, электроснабжение, слаботочные сети и канализация.", "alt": ""}, {"s": "5. Гарантии качества", "q": "п. 5.7.1.1 договор на регистрацию мы предоставляем?", "a": "Нет, все обязанности по предоставлению документов на регистрацию в Росреестр на себя принимает Застройщик, так как подписание и регистрация будет проходит в электронном (дистанционном) виде. Все расходы по электронной регистрации также несёт Застройщик, то есть оплачивает гос. пошлины за регистрацию договора долевого участия и электронную регистрацию.", "alt": ""}, {"s": "5. Гарантии качества", "q": "5.5. Стороны пришли к соглашению, что согласованный Застройщиком с Участником долевого строительства срок для устранения недостатков Объекта долевого строительства, как выявленных при приемке Участником долевого строительства Объекта долевого строительства, так и выявляемых в течение гарантийного срока, составляет 90 (девяносто) календарных дней с даты предоставления Участником долевого строительства доступа к Объекту долевого строительства. Застройщик вправе произвести устранение недостатков до истечения указанного срока.Если после устранения недостатков выявленны новые недостатки, застройщик так же будет устранять повторно в течении 90 к.д.?", "a": "Согласно ч. 6 ст.7 ФЗ № 214-ФЗ Застройщик обязан устранить выявленные недостатки (дефекты) в срок, согласованный Застройщиком с Участником долевого строительства. Согласно п.5.5. Договора стороны согласовывают срок для устранения выявленных недостатков. В связи с чем, ч.1 ст.20 Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» не подлежит применению. Срок изменению не подлежит и согласно Договора составляет 90 (девяносто) календарных дней с даты предоставления Участником долевого строительства доступа к Объекту долевого строительства.", "alt": ""}, {"s": "6. Права и обязанности застройщика", "q": "Почему не указано в договоре что будет платить Застройщик в случае, если не успеет вовремя ввести дом в эксплуатацию, какие будут компенсации?", "a": "Мораторий освобождает строительные компании от обязанности выплачивать штрафы и компенсации дольщикам за перенос сроков ввода объектов в эксплуатацию и другие связанные неустойки.\nДействие моратория распространяется на все жилые объекты, сроки сдачи которых попадают под зону действия постановления — как начатые ранее, так и новые проекты. Мораторий продлили до конца 2025 года, компенсиции не будет.", "alt": ""}, {"s": "7. Права и обязанности участника долевого строительства", "q": "7.1.1. пропишите в дду какой пакет документов требуется", "a": "7.1.1. Изменения в данный пункт договора мы не вносим, пакет документов, необходимый для регистрации, предоставляется в Росреестр в течение 3х дней, с момента подписания настоящего Договора. Пакет документов на регистрацию подаёт застройщик", "alt": ""}, {"s": "7. Права и обязанности участника долевого строительства", "q": "Почему именно электронно подписываем ДДУ/ДКП, а не в МФЦ", "a": "Согласно Федеральному закону № 487-ФЗ и поправкам к 214-ФЗ, с 1 марта 2025 года взаимодействие застройщиков с Росреестром переведено на обязательный электронный формат. Все Застройщики обязаны регистрировать дду и сделки по регистрации права только в эл виде. Все расходы по электронной регистрации также несёт Застройщик, то есть оплачивает гос. пошлины за регистрацию договора долевого участия и электронную регистрацию. Гос пошлину за регистрацию права собственности по дкп покупатель оплачивает самостоятельно. На эл почту приходит квитанция об оплате гос.пошлины.", "alt": ""}, {"s": "7. Права и обязанности участника долевого строительства", "q": "Если захотим продать квартиру до погашения рассрочки/до окончания строительства какие для нас ограничения/расходы? Переуступка у вас платная или нет?", "a": "Переуступка, если есть задолженность, только с согласия Застройщика. Переуступку делаете самостоятельно, далее на почту stranaddu@strana.com новый собственник направляет свой паспорт, контактный номер, эл почту и зарегистрированный договор уступки, выписку из ЕГРН, чтобы юристы обновили данные по программе. Депонент по эскроу поменяем после предоставления необходимых документов.", "alt": ""}, {"s": "8. Особые условия", "q": "подробно описать пункт 8.1", "a": "Межевание происходит всегда, так как строительство идёт на большом земельном участке. После завершения строительства или в момент строительства, земельный участок проходит процедуру межевания и выделяется чёткие границы земельного участка под конкретным домом, который переходит в долевую собственность всех участников долевого строительства данного многоквартирного дома.", "alt": ""}, {"s": "8. Особые условия", "q": "8.2. Что за залог \"Участник долевого строительства подтверждает, что он согласен с передачей Застройщиком в залог/ последующий залог банку земельного участка и его частей, права аренды, субаренды на него в обеспечение возврата кредита….\"", "a": "вариант 1 Для строительства дома мы используем проектное финансирование, земельный участок в период строительства находится в залоге у Банка (эскроу-агента), после того как дом будет введен в эксплуатацию, обременение будет снято. Процедура передачи земельного участка в залог банку закреплена в 214-ФЗ и является обязательной. В случае нарушения застройщиком обязательств участнику долевого строительства автоматически возвращаются деньги со счета эскроу. В случае ввода в эксплуатацию банк удерживает сумму кредита и процентов со всех счетов эскроу и обязан снять обременение с земельного участка. Это основной принцип эскроу, как способ защиты дольщиков.\nвариант 2 Девелоперы строят жилье на собственные и кредитные средства. Пока идет стройка, деньги дольщиков хранятся в банке — на счетах эскроу. Застройщик не сможет получить их, пока не введет объект в эксплуатацию. По закону участники долевого строительства вносят денежные средства в счет уплаты цены договоров участия в долевом строительстве на счета эскроу, открытые в банке, в котором застройщик получил финансирование строительства. После ввода дома в эксплуатацию деньгами с счетов эскроу банк гасит задолженность по кредитным договорам проектного финансирования.\nЕсли застройщик не вводит дом в эксплуатацию дольщик получает свои деньги обратно в полном объеме.", "alt": "Этот пункт означает, что застройщик имеет право передать банку в залог земельный участок (или право аренды на него), чтобы получить целевой кредит на строительство дома. Такой залог прямо предусмотрен статьёй 13 закона 214‑ФЗ как способ обеспечения обязательств застройщика перед дольщиками и банком. В залоге у банка находится именно земля и строящийся объект в целом, а не ваша будущая квартира как отдельный объект: после ввода дома в эксплуатацию и регистрации права собственности залог на объекты долевого строительства прекращается.\nДля вас этот залог не несёт дополнительных рисков: банк заинтересован в достройке дома, а 214‑ФЗ устанавливает, что при обращении взыскания на заложенный участок требования дольщиков учитываются наряду с требованиями банка, поскольку и те и другие финансируют строительство. Ваше согласие в ДДУ — это юридическое подтверждение того, что вы осведомлены о таком механизме финансирования и не возражаете против использования земельного участка как обеспечения кредита."}, {"s": "8. Особые условия", "q": "п.8.2: Это, видимо, стандартный пункт. Но для понимания: что происходит, если застройщик не выплачивает кредит и залог переходит к банку?", "a": "Ваши денежные средства в любом случае защищены, и находятся на счету ЭСКРОУ, в случае невыполнения застройщиком своих обязательств-денежные средства будут возвращены на Ваш текущий счёт", "alt": "Дополнение\nНа практике банк заинтересован не «забирать дом», а довести объект до ввода в эксплуатацию и получить деньги через эскроу. Поэтому залог земли — это инструмент контроля застройщика со стороны банка и элемент вашей защиты, а не дополнительный риск для дольщика."}, {"s": "8. Особые условия", "q": "Прокомментируйте пожалуйста раздел 8. Особые условия. \nЯ так понимаю земля под застройкой находится в залоге? И может быть перемежевание участка и прочее? Дайте пояснения пожалуйста.", "a": "Земельный участок, на котором ведётся строительство действительно находится в залоге у Банка, который осуществляет проектное финансирование. После ввода объекта в эксплуатацию и получения денежных средств с счетов эскроу участников долевого строительства Банк теряет право на залог, так как все обязательства Застройщиком выполнены. Межевание происходит всегда, так как строительство идёт на большом земельном участке. После завершения строительства земельный участок проходит процедуру межевания и выделяется чёткие границы земельного участка под конкретным домом, который переходит в долевую собственность всех участников долевого строительства данного многоквартирного дома.", "alt": ""}, {"s": "9. Ответственность сторон", "q": "Не увидел пункт про неустойку в договоре, в случае задержки строительства.", "a": "В п. 9.1 указано, что Застройщик несёт ответственность за неисполнение или ненадлежащее исполнение своих обязательств по Договору в порядке, предусмотренном ФЗ № 214-ФЗ. Информация про неустойку указана в статья 6. «Срок передачи застройщиком объекта долевого строительства участнику долевого строительства» данного федерального закона. Мораторий освобождает строительные компании от обязанности выплачивать штрафы и компенсации дольщикам за перенос сроков ввода объектов в эксплуатацию и другие связанные неустойки.\nДействие моратория распространяется на все жилые объекты, сроки сдачи которых попадают под зону действия постановления — как начатые ранее, так и новые проекты. Мораторий продлили до конца 2025 года, компенсиции не будет.", "alt": ""}, {"s": "9. Ответственность сторон", "q": "п 9.4 Почему суд указан в г.Тюмень, если я проживаю в другом городе", "a": "Суд только в Тюмени, т.к. головной офис и юр. отдел находится в г. Тюмень.", "alt": "В договоре указан суд города Тюмени, потому что это место нахождения застройщика . Закон (ГПК РФ) допускает, что стороны могут заранее согласовать подсудность споров, и застройщик фиксирует её по своему адресу. При этом, если вы как потребитель посчитаете это условие нарушающим ваши права, вы всё равно вправе подать иск по месту своего жительства или по месту заключения/исполнения договора — такие права даёт Закон о защите прав потребителей и разъяснения Верховного суда. То есть наличие Тюмени в договоре не лишает вас возможности защищать свои права в «своём» суде."}, {"s": "10. Обстоятельства непреодолимой силы (форс-мажор)", "q": "10.1. от какой ответственности еще освобождается застройщик", "a": "К обстоятельствам непреодолимой относятся обстоятельства, которые стороны не могли предвидеть, и, как следствие, предотвратить (ч. 3 ст. 401 ГК РФ). Некоторые из них мы буквально перечислили в договоре, остальные обстоятельства могут быть таковы, как в определении -н-р: наводнение, ураган, война", "alt": ""}, {"s": "10. Обстоятельства непреодолимой силы (форс-мажор)", "q": "п10.2 почему в договоре нет что застройщик несёт ответственность за повреждение или гибель объекта до передачи его дольщикам?", "a": "Застройщик несёт ответственность, данная информация указана в п. 9 Ответственность сторон: «Застройщик несёт ответственность за неисполнение или ненадлежащее исполнение своих обязательств по Договору в порядке, предусмотренном ФЗ № 214-ФЗ».", "alt": ""}, {"s": "11. Расторжение и изменение договора", "q": "11.3. В случае расторжения Договора не по вине Застройщика проценты на внесенные Участником долевого строительства денежные средства за пользование указанными денежными средствами не начисляются.\n\nПро какие проценты идет речь? На эскроу не начисляются проценты. А если расторжение по вине застройщика?", "a": "ст. 395 ГК РФ предусматривает проценты за пользование чужими денежными средствами средствами. Здесь говорится о том, что если будет расторжение по инициативе участника долевого строительства- проценты участник долевого строительства взыскать не сможет.", "alt": ""}, {"s": "11. Расторжение и изменение договора", "q": "П 11.4. В случае согласия Застройщика на расторжение Договора по инициативе Участника долевого строительства, при отсутствии вины Застройщика (отсутствуют основания для отказа от исполнения договора), Участник долевого строительства уплачивает Застройщику штраф в размере 5% (пяти процентов) от цены Договора, указанной в пункте 3.1 договора. Подписанием Договора Участник долевого строительства подтверждает своё согласие на удержание суммы указанного штрафа из денежных средств, подлежащих возврату Участнику долевого строительства после расторжения Договора и даёт поручение Эскроу-агенту перечислить сумму штрафа Застройщику. Пункт не законный, Уберите из договора", "a": "Пункт 11.4 не подлежит корректировке или удалению. Со стороны Застройщика выполняются все условия, описанные в договоре долевого участия. Также застройщик берёт на себя все расходы по оформлению (оплата гос. пошлин, электронной регистрации и т.д). Вы оплачиваете только дополнительные расходы, связанные с требованиями Банка. Если по какой-то причине Вы примите решение расторгнуть Договор долевого участия, Застройщик несёт убытки и в праве требовать компенсации за них.", "alt": ""}, {"s": "11. Расторжение и изменение договора", "q": "11.1. Расторжение или изменение Договора должно быть оформлено Сторонами в письменном виде, путём подписания ими Соглашения о расторжении Договора или Дополнительного соглашения. Я правильно понимаю, что будет ещё составляться доп. соглашение или нет? Если да , то где соглашение к договору? Если нет , то нужно прописать в договоре: Я могу расторгать договор ДДУ, если:\nЗастройщик задержал передачу квартиры на + 2 месяца\nСтроительная фирма существенно изменила проектную декларацию. К примеру, этажей стало больше\nЗастройщик построил квартиру площадью отличной от проектной на 5%\nВам стало очевидно, что застройщик перенесёт сроки строительства на + 2 месяца", "a": "Нет, доп. соглашение составляется, только при необходимости. Например, клиент решил изменить тип ремонта. Данная информация не указывается, так как она предусмотрена в п. 9 Ответственность сторон.", "alt": ""}, {"s": "11. Расторжение и изменение договора", "q": "Также прописать в договоре, что при расторжении ДДУ, ЗАСТРОЙЩИК возвращает стоимость квартиры и платит проценты за пользование деньгами. А также он должен выплатить проценты по ипотеке и разницу между стоимостью квартиры на день расторжения и днём покупки. Эти пункты вносите в договор.11.3. В случае расторжения Договора не по вине Застройщика проценты на внесённые Участником долевого строительства денежные средства за пользование указанными денежными средствами не начисляются. Убрать из договора.", "a": "Ответственность Застройщика за неисполнение или ненадлежащее исполнение своих обязательств по Договору долевого участия указано в ФЗ-214, поэтому отображение её в договоре долевого участия нет (только пункт 9). Данный пункт «В случае расторжения Договора не по вине Застройщика проценты на внесённые Участником долевого строительства денежные средства за пользование указанными денежными средствами не начисляются. Убрать из договора» исключение не подлежит, так как Застройщик не несёт финансовую нагрузку за пользование денежных средств Банка и не является участником кредитного договора.", "alt": ""}, {"s": "12. Заключительные положения", "q": "12.5 просят добавить почтовый ящик, чтобы еще направили заказное бумажное уведомление, помимо электронного письма и/или смс сообщение", "a": "Шаблон Договора участия в долевом строительстве (типовой и един для всех Участников долевого строительства. ДУДС согласован Росреестром, ГУСом, эскроу- агентом. Шаблон ДУДС размещен на сайте ЕИЖС и изменению и внесению правок не подлежит. ДУДС составлен в соответствии с требованиями Закона 214-ФЗ. Любые изменения могут грозить приостановкой регистрации в Росреестре.", "alt": ""}, {"s": "12. Заключительные положения", "q": "12.6 12.6 Какие именно реквизиты могут поменяться?Клиент переживает за то что платежи может вносить не туда, после того как закроется эскроу и мы вдруг поменяем РС, не уведомив еговедомление", "a": "Если поменяется р/с мы уведомляем. т.к. это и в наших инетресах. Такие сделки на контроле у бухгалтерии в т.ч . пусть не переживает", "alt": ""}, {"s": "ДДУ: машино-места", "q": "По паркингу будет разметка? По стояночным местам?", "a": "Да, все парковочные места пронумерованы и имеют чёткую разметку.", "alt": ""}, {"s": "ДДУ: машино-места", "q": "Прошу пояснить/ внести корректировки в п. 2.4\"Расположение колонн, инженерного и иного оборудования могут быть уточнены Застройщиком в результате проведения строительных работ в рамках проектной документации без предварительного уведомления Участника долевого строительства;Линии, обозначающие машино-место на плане, не являются линиями перегородок и не возводятся, могут быть незначительно уточнены/перенесены ....\"\nОбоснование- мы парковочное местотвыбирали исходя из текущей визуализации, и это важно для нас, а нас даже не уведомят об изменениях", "a": "На объекте долевого строительства уже возведен монолитный-каркас здания и паркинга, расположенного на цокольном этаже. На данном этапе строительства какие-либо изменения в конструктив здания не вносятся. В приложении 1 к Договору долевого участия № 2.136мм указано актуальное расположение парковочного места и монолитных колонн. Линии разметки могут быть незначительно перенесены на несколько миллиметров в одну или другую сторону, в рамках проектной декларации, но от этого не изменится общая площадь парковочного места и его расположение.", "alt": ""}, {"s": "ДДУ: машино-места", "q": ". Если по каким то причинам мы не впишемся между столбами ( поскольку обозначена площадь, а не размеры парковочного места, что тогда?", "a": "Парковочные места на объектах жилого строительства проектируются в соответствии с ГОСТами которые устанавливают размеры парковочных мест на стандартной парковке для легковых автомобилей. Стандартное парковочное место предусматривает свободное размещение в том числе крупногабаритных легковых автомобилей. Соответствие всем ГОСТам и строительным нормам жестко регламентировано и контролируется со стороны органов государственной власти.", "alt": ""}, {"s": "Общие вопросы", "q": "(без формулировки)", "a": "ответ", "alt": ""}, {"s": "Общие вопросы", "q": "при запросе проектной документации", "a": "Клиент может воспользоваться общедоступной информацией на сайте Наш.ДОМ.РФ. С иной информацией можно ознакомиться по предварительному запросу в офисе застройщика. \n(Большая часть документов является коммерческой тайной и не подлежат размещению в общем доступе. Клиенты могут ознакомиться (без фото и видео фиксации). Как альтернативу Уставу можно заказать выписку из ЕГРЮЛ.", "alt": ""}, {"s": "Общие вопросы", "q": "про любые изменеия в дду :", "a": "Шаблон Договора участия в долевом строительстве (далее ДУДС) типовой и един для всех Участников долевого строительства. ДУДС согласован Росреестром, ГУСом, эскроу- агентом. Шаблон ДУДС размещен на сайте ЕИЖС и изменению и внесению правок не подлежит. ДУДС составлен в соответствии с требованиями Закона 214-ФЗ. Любые изменения могут грозить приостановкой регистрации в Росреестре. Есть правила формирования сроков по проектной документации,поэтому во всех документах должны данные совпадать. Внести корректировки не сможем в один из договоров.", "alt": ""}, {"s": "Общие вопросы", "q": "Почему не можем предоставить размеры квартиры?", "a": "У нас нет точных размеров, они появляются только на этапе ввода дома и при замере кадастровым инженером. Так как дом строится, то параметры могут меняться и если мы выдадим данные и человек закажет себе кухню, а при сдаче будет разница в 5 см, то кухня может не войти (как пример) \nКадастровые планы будут размещены на сайте управляющей компании в разделе \"Дома\". Об этом сообщим в мобильном приложении. Размеры, указанные в проектной документации, в процессе строительства дома могут измениться, что прописано в договоре долевого участия. Корректные размеры вашей квартиры будут доступны в момент ввода дома в эксплуатацию, когда пройдёт этап замеров всех квартир кадастровым инженером.", "alt": ""}, {"s": "Общие вопросы", "q": "прошу письменно разъяснить порядок действий сторон при устранении недостатков (дефектов) выявленных при приемке объекта", "a": "по поводу приемки квартиры\nПеред тем, как передать квартиру Вам, наша компания осматривает квартиру минимум в 4 этапа при участии службы клиентского сервиса и контроля качества, пока все обнаруженные недочёты не будут устранены.\nНа осмотр квартиры, вы можете приходить с аттестованным экспертом по приемке квартир, часть незначительных замечаний(если таковые будут) могут устранить даже в моменте, пока Вы занимаетесь осмотром, если есть такая возможность, либо в течении небольшого промежутка времени(все зависит от сложности).\nАкт приёма передачи возможно не подписывать до устранения замечаний, это ваше право.\nЗамечания можно будет указать на обратной стороне акта и передать нашим сотрудникам, они уже в свою очередь передадут их в отдел гарантии.\nМы заинтересованы устранить все недочеты как можно быстрее, для передачи ключей в короткие сроки, чтобы Вы смогли скорее заехать в долгожданную квартиру Вашей мечты.", "alt": ""}, {"s": "Общие вопросы", "q": "Проверяли информацию о застройщике на сайте . Почему по финансовым показателям у застройщика убытки в финансовой отчетности", "a": "СЗ начинает свою деятельность задолго до старта строительства жилого комплекса, принимая на себя все сопутствующие расходы еще до получения какой-либо прибыли. Однако, когда начинается строительство и подписывается проектное финансирование, убытки компенсируются благодаря средствам, поступающим на эскроу-счета.", "alt": ""}, {"s": "Общие вопросы", "q": "полная стоимость кредита", "a": "СЗ начинает свою деятельность задолго до старта строительства жилого комплекса, принимая на себя все сопутствующие расходы еще до получения какой-либо прибыли. Однако, когда начинается строительство и подписывается проектное финансирование, убытки компенсируются благодаря средствам, поступающим на эскроу-счета.", "alt": ""}, {"s": "Общие вопросы", "q": "на какие нормы ссылаемся при отделке", "a": "Минстрой утвердил финальный приказ о минимальных требованиях к отделке квартир, продающихся по ДДУ\nОн действует в течение шести лет со дня его вступления в силу — с 28 февраля 2025 года.\nОсновные моменты:\n🔸Отштукатуренные поверхности стен не должны отклоняться от вертикали при замере на всю высоту помещенця более чем на 10 мм при высоте помещения до З м включительно, на 12 мм при высоте помещения от 3 м до 6 м (включительно), на 15 мм при высоте помещения более 6 м.\n🔸То же касается поверхностей стен, облицованных керамической или керамогранитной\nплиткой.\n🔸Окрашенные поверхности не должны иметь полосы, пятна, подтеки, брызги, следы от кисти и (или) валика, визуально различимые на общем фоне окрашенной поверхности с расстояния не менее 2 м.\n🔸На поверхности стен, облицованных керамической или керамогранитной плиткой, не допускаются пропуски, выпадения заделки межплиточных швов.\n🔸На поверхностях, оклеенных обоями, не допускаются воздушные пузыри, вмятины, пятна и загрязнения, неровности и повреждения поверхности, изменения текстуры и цвета, расхождение стыков полотен обоев, а также наклейки и отслоения, визуально различимые с расстояния не менее 2 м.\n🔸Между плинтусами и покрытием стен должны отсутствовать зазоры величиной более 4 мм.\n🔸Поверхность напольного покрытия не должна иметь отклонений от горизонтали или предусмотренного проектной документацией уклона, измеренных по диагонапи помещения, превышающих 8 мм для длины диагонали от 3 до 6 м включительно, 12 мм для длины диагонали от 3 до 6 м включительно, 16 мм для длины диагонали от 6 м до 15 м включительно.\nТаким образом, теперь СТО (Стандарт внутренней отделки помещений) застройщика в новостройках должен соответствовать требованиям к отделочным работам не ниже тех, что утвердил Минстрой РФ.", "alt": ""}, {"s": "Общие вопросы", "q": "Минимальный срок владения имуществом, приобретенный по ДДУ, считается с какой даты?", "a": "Стараемся не консультировать по данной теме, но если настоятельно требуют, то просим помощи юр. отдела.Ответ из просторов инетернета - \"Минимальный срок владения имуществом, оплаченным по договору ДДУ, отсчитывается с момента полной оплаты стоимости объекта. Соответствующие изменения внесены в НК РФ Федеральным законом от 23.11.2020 № 374-ФЗ и распространяются на доходы граждан, полученные начиная с 2019 года. Таким образом, те, кто покупает, например, квартиру на стадии строительства, могут продать ее без уплаты НДФЛ через пять лет после полной оплаты или через три года, если это единственное жилье\"", "alt": ""}, {"s": "Общие вопросы", "q": "Не снято обременение с квартиры, хотя долга нет, что делать?", "a": "Проверяем долг по АМО, в 1С, запрашиваем справку о полной оплате и направляем в юр отдел для снятия обременения", "alt": ""}, {"s": "Общие вопросы", "q": "Хотят выделить доли детям при покупке квартиры в рассрочку, почему нельзя? какие основания отказа?", "a": "Согласно внутренним регламентам компании проведение сделок с несовершеннолетними и типом оплаты рассрочка запрещено. Большие риски для Застройщика, в случае неоплаты по договору. А именно расторжение договора с несовершеннолетними длительное и только через согласование с органами опеки, если есть альтернативный вариант недвижимости.", "alt": ""}, {"s": "Общие вопросы", "q": "Клиент получил материнский семейный капитал не по рождению детей, а в связи с тем, что её мать лишили родительских прав и сертификат поделили между детьми (она одна из детей матери, которую лишили родительских прав). Хочет использовать сертификат для приобретения жилья у нас, остальное наличные. Мы можем так сделать?", "a": "Можно использовать данный сертификат при покупке квартиры", "alt": ""}, {"s": "Общие вопросы", "q": "Почему мы не можем поменять основного заемщика/депонента по эскроу при подписании допника при переходе на ипотеку? или добавить /исключить собственника?", "a": "В связи с изменениями в Росреестре, при переходе с рассрочки на ипотеку , либо по желанию клиента, внести изменения в состав участником Доп.соглашением НЕВОЗМОЖНО. \nИсключения - дети (при использовании МСК) \nСупруги - по решению регистратора.\nтаким образом : Добавить / исключить третье лицо по Доп. соглашению к ДДУ - нельзя, отказ в регистрации. \nРешение : При переходе на ипотеку по действующим рассрочкам с донором, которого нет изначально в ДДУ - Расторжение ДДУ и выход на ипотеку с новыми участниками по новому ДДУ. \nНовые рассрочки с планом выйти на СИ с донором - включить третье лицо в ДДУ на этапе оформления.", "alt": ""}, {"s": "Общие вопросы", "q": "оформляет квартиру в долевую собственность по ДУДС, может ли он оформить потом переуступку только на свою доля? Или переуступка возможна только всей квартиры?", "a": "Уступить смогут, но сделка будет нотариальная. На момент когда решат это делать, то надо будет еще раз уточнять информацию в Росреестре, т.к. все меняется. \nНа данный момент так. Если уступают третьему лицу, а не тому у кого еще доля, то через нотариуса.", "alt": ""}, {"s": "Общие вопросы", "q": "как покупатель может узнать прошла ли регистрация права собственности (после получения ключей и подписания АПП)", "a": "Покупателю на почту приходит квитанция на оплату госпошлины, ее необходимо оплатить и после регситрации права на почту покупателя приходит выписка из ЕГРН, подтверджающая права собственности. Если оплаты по квитанции не будет, то необходимо будет обратится в МФЦ, оплатить гос пошлину и самостоятельно подать документы на регистрацию права. При себе иметь паспорта всех сосбвтенников, выписку о регистрации ДДУ, акт приема-передачи.", "alt": ""}, {"s": "Общие вопросы", "q": "если парень и девушка покупали квартиру в долевую собственность и далее решили вступить в брак до получения ключей, что-то нужно делать?", "a": "Если покупает пара (не в браке) по ДОЛЯМ и планирует до получения квартиры/мм/нежилого и тд вступить в брак, то им надо будет делать брачный договор или соглашение об определении долей у нотариуса (определять режим собственности на данный объект , где они приобретали долями) или решение суда с определением кому что досталось", "alt": ""}, {"s": "Общие вопросы", "q": "Покупали квартиру в ипотеку (оба в КД) в общесовместную собственность. По личным обстоятельствам, необходимо супругу вывести из участников сделки", "a": "Необходимо сделать брачный договор, так же необходимо сначала с банком согласовать, после этого мы сможем подготовить доп соглашение", "alt": ""}, {"s": "Общие вопросы", "q": "Квартира в общесовместную соб-ть, ипотека тоже на обоих супругов, разводятся и хотят исключить одного супруга из сделки.", "a": "Получают решение суда. Мы готовим шаблон доп.соглашения. Покупатель обращается в банк с решением суда и нашим доп соглашением, получает согласие банка (не все банки одобряют) и только после получения согласия банка, мы зарегистрируем доп. соглашение.", "alt": ""}, {"s": "Общие вопросы", "q": "Клиент просит зарегистрировать доп соглашение к дду, хотя уже получил ключ и право собственности", "a": "Росреестр не зарегистрирует допсоглашение к ДДУ после сдачи дома, получения ключей и оформления права собственности — обязательства по договору исполнены, основания для изменений прекращены. п. 3 ч. 1 ст. 29 Закона №218‑ФЗ", "alt": ""}, {"s": "Общие вопросы", "q": "сколь у Застройщика гарантия на окна?", "a": "Кто заключил дду до 01.09.2024 - 5 лет, после 3 года", "alt": ""}, {"s": "Общие вопросы", "q": "не хотят делать нотариальное согласие для ДКП", "a": "Для заключения договора купли продажи требуется нотариально удостоверенное согласие.\nОснование: п. 2 ст. 35 Семейного кодекса РФ:\n\"Для заключения одним из супругов сделки по распоряжению имуществом, права на которое подлежат государственной регистрации, сделки, для которой законом установлена обязательная нотариальная форма, или сделки, подлежащей обязательной государственной регистрации, необходимо получить нотариально удостоверенное согласие другого супруга\"\nПоскольку договор купли-продажи квартиры подлежит государственной регистрации в Росреестре, он попадает под действие данной нормы. Кроме того, приобретаемая квартира буде
